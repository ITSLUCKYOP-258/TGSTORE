services:
  - type: web
    name: tgstore
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci && cd ../client && npm ci && npm run build && cd ../server
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEV_LOGIN
        value: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: MT_API_ID
        sync: false
      - key: MT_API_HASH
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
