services:
  - type: web
    name: tgstore
    runtime: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm ci && cd ../client && npm ci && npm run build && cd ../server
    startCommand: node src/index.js
    healthCheckPath: /api/health
    # Note: Render Free plan does not support persistent disks.
    # To enable persistent SQLite storage on Render, change plan: starter ($7/mo)
    # and uncomment the disk configuration below:
    # disk:
    #   name: tgstore-data
    #   mountPath: /data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DEV_LOGIN
        value: false
      - key: ADMIN_KEY
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MT_API_ID
        sync: false
      - key: MT_API_HASH
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
